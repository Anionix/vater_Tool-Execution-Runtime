[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "verified-execution-prototype"
version = "0.11.0"
description = "Python-first local verified tool execution prototype"
requires-python = ">=3.13"
dependencies = ["anyio>=4,<5"]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4", "pydantic>=2"]
mcp = ["mcp==2.3.0"]

[project.scripts]
verified-execution = "verified_execution.local_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
