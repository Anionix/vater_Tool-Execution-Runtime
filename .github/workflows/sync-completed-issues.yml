name: Sync completed issues

on:
  push:
    paths:
      - backlog/tasks.jsonl
      - backlog/ISSUE_INDEX.jsonl
      - backlog/validate_tasks.py
      - scripts/import_github_issues.py
      - scripts/sync_completed_issues.py
      - .github/workflows/sync-completed-issues.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-completed-issues-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && github.repository == 'Anionix/vater_Tool-Execution-Runtime'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Close completed issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_completed_issues.py --repo "$GITHUB_REPOSITORY" --apply
