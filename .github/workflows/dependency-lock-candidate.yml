# LOCK-WORKFLOW-001: REQUESTED -> RESOLVED -> SYNTAX_CHECKED -> HASH_INSTALLED -> TESTED | FAILED.
# This produces a candidate artifact only. Nothing is silently accepted as a release lock.
name: Python dependency lock candidate

on:
  workflow_dispatch:
  push:
    paths:
      - pyproject.toml
      - scripts/check_dependency_lock.py
      - tests/test_dependency_lock.py
      - .github/workflows/dependency-lock-candidate.yml

permissions:
  contents: read

jobs:
  resolve-python313-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install explicitly selected resolver
        run: python -m pip install uv==0.10.0
      - name: Resolve production, test and official MCP dependencies
        run: >-
          uv pip compile pyproject.toml
          --extra test --extra mcp
          --python-version 3.13
          --python-platform x86_64-unknown-linux-gnu
          --generate-hashes
          --output-file requirements-py313.lock
      - name: Refuse incomplete or unsafe lock
        run: python scripts/check_dependency_lock.py requirements-py313.lock
      - name: Create clean installation environment
        run: python -m venv .venv
      - name: Verify artifact hashes during clean install
        run: uv pip sync requirements-py313.lock --python .venv/bin/python --require-hashes
      - name: Check installed dependency closure
        run: uv pip check --python .venv/bin/python
      - name: Confirm expected official SDK version
        run: .venv/bin/python -c "from importlib.metadata import version; assert version('mcp') == '2.3.0'"
      - name: Exercise the real official SDK separately
        env:
          PYTHONPATH: src
        run: .venv/bin/python -m pytest -q -rs tests/test_official_mcp_sdk.py
      - name: Publish lock candidate for human review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python313-linux-lock-candidate-unreviewed
          path: requirements-py313.lock
          if-no-files-found: warn
          retention-days: 7
