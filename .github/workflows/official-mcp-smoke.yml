# MCP-SMOKE-001: diagnostic, not a production release gate.
# CANDIDATE -> SDK_INSTALLED -> REAL_PROTOCOL_TESTS -> REPORT_CHECKED -> DIAGNOSTIC_PASS | FAIL
# Dependency versions other than mcp are not hash-pinned here. Do not publish a release from this result.
name: Official MCP diagnostic smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - server_mcp.py
      - pyproject.toml
      - src/verified_execution/**
      - tests/test_official_mcp_sdk.py
      - scripts/check_test_report.py
      - .github/workflows/official-mcp-smoke.yml

permissions:
  contents: read

jobs:
  diagnostic-only:
    name: Diagnostic only - NOT a release gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install diagnostic dependencies (not a release lock)
        run: python -m pip install --disable-pip-version-check '.[test,mcp]'
      - name: Verify official distribution and exact version
        run: python -c "from importlib.metadata import version; assert version('mcp') == '2.3.0'; print('Official MCP 2.3.0 installed')"
      - name: Execute real official SDK tests
        run: python -m pytest -q -rs --junitxml=official-mcp-smoke.xml tests/test_official_mcp_sdk.py
      - name: Require all fourteen real SDK cases to run and pass
        run: python scripts/check_test_report.py official-mcp-smoke.xml --minimum 14
      - name: Preserve the diagnostic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: official-mcp-diagnostic-not-release-evidence
          path: official-mcp-smoke.xml
          if-no-files-found: warn
          retention-days: 7
