# CI-STATE-001: CREATED -> RUNNING -> PASS | FAIL | NOT_RUN.
# Real MCP tests must never be replaced by mocked adapter tests.
name: Python verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install offline test requirements
        run: python -m pip install '.[test]'
      - name: Compile Python source
        run: python -m compileall -q src scripts tests server_mcp.py
      - name: Enforce production-code static safety policy
        run: python scripts/check_static_policy.py
      - name: Refuse a permission change without its history entry
        run: python scripts/permission_history.py check
      - name: Run strict boundary tests
        run: >-
          python -m pytest -q
          tests/test_adapter_boundary.py
          tests/test_cli.py
          tests/test_contracts.py
          tests/test_core.py
          tests/test_guarded_stdio.py
          tests/test_output_boundary.py
          tests/test_policy_config.py
          tests/test_static_policy.py
          tests/test_dependency_lock.py
          tests/test_test_report_gate.py
          tests/test_ci_workflow_contracts.py
          tests/test_unicode_input_validation.py
          tests/test_local_mcp_launcher.py

  durable-state:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install local state test requirements
        run: python -m pip install '.[test]'
      - name: Run SQLite and cancellation tests
        run: >-
          python -m pytest -q
          tests/test_ledger.py
          tests/test_recorded_calculator.py
          tests/test_recorded_cli.py
          tests/test_recorded_tool_bridge.py
          tests/test_worker_leases.py
          tests/test_worker_bridge.py
          tests/test_request_cancellation.py
          tests/test_async_request_cancellation.py
          tests/test_cancellation_journal.py
          tests/test_sqlite_cancel_wait.py

  dependency-vulnerabilities:
    # task.operations.005: every locked package checked against OSV, standard library only
    # (no third-party scanner is installed); the report is kept, and a known vulnerability fails.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Query OSV for every locked package
        run: python -I scripts/scan_vulnerabilities.py --output osv-scan.json
      - name: Keep the scan result
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: osv-scan
          path: osv-scan.json
          if-no-files-found: warn
          retention-days: 90

  formal-rust:
    # task.formal_verification.011 / 012 / 013 / 015: the Rust port is tested against the shared
    # literal expected values and verified with Kani in a job of its own; no Python job installs a
    # proof tool (task.operations.001).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Test the Rust port against the shared literal expected values
        working-directory: rust/vater_core
        run: cargo test --locked
      - name: Install the pinned Kani verifier
        run: cargo install --locked kani-verifier --version 0.68.0
      - name: Set up Kani
        run: cargo kani setup
      - name: Verify the Rust port with Kani
        working-directory: rust/vater_core
        shell: bash
        run: cargo kani 2>&1 | tee ../../kani-output.txt
      - name: Require every audited harness to verify with all covers satisfied
        run: python scripts/check_kani.py kani-output.txt --record evidence/formal/kani-results.json
      - name: Keep the Kani output
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kani-output
          path: kani-output.txt
          if-no-files-found: warn
          retention-days: 90

  release-artifacts:
    # task.operations.006 / 008 / 009: artifacts are built and kept only after every verification
    # job (including the safety tests) and every security check of the release gate has passed.
    needs: [offline-contracts, durable-state, dependency-vulnerabilities, formal-rust, official-mcp]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Stop the release on any failed security check
        run: python scripts/release_gate.py --output release-gate.json
      - name: Install the hash-locked build backend
        # A folded block: ':all: ' would end a plain YAML scalar.
        run: >-
          python -m pip install --require-hashes --only-binary :all: -r requirements-build.lock
      - name: Build under varied environments and record every SHA-256
        run: python scripts/release_manifest.py --output release-manifest.json --dist dist
      # No 'if: always()': nothing is distributed after a failed gate or build.
      - name: Keep the artifacts and their manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-artifacts
          path: |
            dist/
            release-manifest.json
          if-no-files-found: error
          retention-days: 90
      # task.operations.017: the extended release only when every initial and added-feature gate
      # passed with evidence still bound to the current files.
      - name: Decide which releases the gates allow
        id: decision
        run: python scripts/release_decision.py --output release-decision.json --github-output "$GITHUB_OUTPUT"
      - name: Publish the extended release
        if: steps.decision.outputs.extended == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: extended-release
          path: |
            dist/
            release-manifest.json
            release-decision.json
          if-no-files-found: error
          retention-days: 90
      - name: Keep the release gate report and decision
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-gate
          path: |
            release-gate.json
            release-decision.json
          if-no-files-found: warn
          retention-days: 90

  official-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Fail closed without a reviewed transitive hash lock
        run: python scripts/check_dependency_lock.py requirements-py313.lock
      - name: Install all requirements with their checked artifact hashes
        run: python -m pip install --require-hashes -r requirements-py313.lock
      - name: Check installed dependency compatibility
        run: python -m pip check
      - name: Require the locked Python set and report formal toolchains without counting them as passed
        run: python scripts/check_toolchains.py --require-locked-python
      - name: Refuse tests if the real official SDK is missing
        run: python -c "from importlib.metadata import version; assert version('mcp') == '2.3.0'"
      - name: Run real official SDK integration separately
        run: python -m pytest -q -rs --junitxml=official-mcp-report.xml tests/test_official_mcp_sdk.py
      - name: Require all official MCP integration cases to execute and pass
        run: python scripts/check_test_report.py official-mcp-report.xml --minimum 14
      - name: Run the staging trial with synthetic data only
        run: python scripts/staging_trial.py --output staging-trial.json
      - name: Verify trust phase using the same locked environment
        run: python scripts/verify_phase.py trust
      - name: Verify all contract tasks
        run: python scripts/verify_phase.py contracts
      - name: Verify all runtime tasks
        run: python scripts/verify_phase.py runtime
      - name: Verify all authorization tasks
        run: python scripts/verify_phase.py authorization
      - name: Verify all transport tasks
        run: python scripts/verify_phase.py mcp_transport
      - name: Verify all read-only tasks
        run: python scripts/verify_phase.py read_only
      - name: Verify minimum validation tasks
        run: python scripts/verify_phase.py minimum_validation
      - name: Verify minimum release tasks
        run: python scripts/verify_phase.py minimum_release
      - name: Verify all durable operation tasks
        run: python scripts/verify_phase.py durable_operations
      - name: Verify all model adapter tasks
        run: python scripts/verify_phase.py provider_adapters
      - name: Check the formal evidence source hashes
        run: sha256sum -c evidence/formal/SHA256SUMS
      - name: Verify all formal verification tasks
        run: python scripts/verify_phase.py formal_verification
      - name: Verify all local HTTP tasks
        run: python scripts/verify_phase.py http_interface
      - name: Verify all testing tasks (includes the regression registry)
        run: python scripts/verify_phase.py testing
      - name: Verify all operations tasks
        run: python scripts/verify_phase.py operations
      - name: Audit evidence and documentation for secret values
        run: python scripts/audit_logs.py evidence/ docs/
